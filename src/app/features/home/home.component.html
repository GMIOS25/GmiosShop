<div class="home-container">
  
  <!-- Categories Section -->
  <section class="categories-section">
    <h2 class="section-title">DANH MỤC TRÒ CHƠI</h2>
    
    @if (accountService.loading()) {
      <div class="loading-grid">
        @for (i of [1, 2, 3]; track i) {
          <div class="game-card skeleton-card">
            <div class="skeleton skeleton-icon"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-subtitle"></div>
          </div>
        }
      </div>
    } @else {
      <div class="games-grid">
        @for (game of accountService.games(); track game.slug) {
          <div class="game-card" [routerLink]="['/game', game.slug]">
            @if (game.image_url) {
              <div class="game-card-bg" [style.backgroundImage]="'url(' + game.image_url + ')'"></div>
            }
            <div class="game-card-overlay"></div>
            <div class="game-card-content">
              <div class="game-icon"><img [src]="getGameIcon(game.slug)" alt="{{ game.name }} logo" width="48" height="48" /></div>
              <h3 class="game-name">{{ game.name }}</h3>
              <p class="game-count">Khám phá kho tài khoản cực phẩm</p>
              <div class="game-card-footer">
                <span class="view-catalog-link">Xem Danh Sách →</span>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </section>
  
</div>
<!-- label placeholder aria-label -->
